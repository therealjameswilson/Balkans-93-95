name: Codex Apply Chronology Scope

on:
  push:
    paths:
      - ".github/workflows/codex-apply-scope.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply chronology scope patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch target: {label}")
              return text.replace(old, new, 1)

          app = Path('app.js')
          s = app.read_text()
          s = replace_once(s, '  search: "",\n  conversationKind:', '  search: "",\n  conversationScope: "Declassified",\n  conversationKind:', 'state scope')
          s = replace_once(s, '  conversationSearch: document.querySelector("#conversation-search"),\n  conversationKindFilters:', '  conversationSearch: document.querySelector("#conversation-search"),\n  conversationScopeFilters: document.querySelector("#conversation-scope-filters"),\n  conversationKindFilters:', 'scope node')
          s = replace_once(s, '    source.title,\n    source.identifier,', '    source.title,\n    source.label,\n    source.identifier,', 'source label search')
          s = replace_once(s, '    source.type,\n    ...(source.tags || [])', '    source.type,\n    source.status,\n    source.scope,\n    ...(source.tags || [])', 'source status search')
          s = replace_once(s, '  return (order[a.priority] ?? 9) - (order[b.priority] ?? 9) || a.title.localeCompare(b.title);', '  return (order[a.priority] ?? 9) - (order[b.priority] ?? 9) || sourceTitle(a).localeCompare(sourceTitle(b));', 'priority sort fallback')
          s = replace_once(s, 'function priorityClass(priority) {\n  return (priority || "").toLowerCase();\n}\n\nfunction createTagRow', 'function priorityClass(priority) {\n  return (priority || "").toLowerCase();\n}\n\nfunction sourceTitle(source = {}) {\n  return source.title || source.label || source.id || "Untitled source";\n}\n\nfunction sourceTypeLabel(source = {}) {\n  return source.type || source.status || "Report";\n}\n\nfunction createTagRow', 'source fallback helpers')
          s = replace_once(s, 'function conversationYear(record) {\n  return (record.sortDate || "").slice(0, 4);\n}\n\nfunction filteredConversations', 'function conversationYear(record) {\n  return (record.sortDate || "").slice(0, 4);\n}\n\nfunction isPublicPaperRecord(record) {\n  return record.documentScope === "Public statement";\n}\n\nfunction isConversationRecord(record) {\n  return ["Memcon", "Telcon"].includes(record.kind) || /conversation/i.test(record.documentScope || "");\n}\n\nfunction matchesConversationScope(record) {\n  if (state.conversationScope === "All") return true;\n  if (state.conversationScope === "Public Papers") return isPublicPaperRecord(record);\n  if (state.conversationScope === "Presidential conversations") return isConversationRecord(record);\n  return !isPublicPaperRecord(record);\n}\n\nfunction filteredConversations', 'scope functions')
          s = replace_once(s, '  return conversationRecords(data)\n    .filter((record) => state.conversationKind === "All" || record.kind === state.conversationKind)', '  return conversationRecords(data)\n    .filter(matchesConversationScope)\n    .filter((record) => state.conversationKind === "All" || record.kind === state.conversationKind)', 'scope filtering')
          s = replace_once(s, '  const conversations = conversationRecords(data);\n  const kinds = ["All", ...new Set(conversations.map((record) => record.kind).sort())];', '  const conversations = conversationRecords(data);\n  const scopes = ["Declassified", "All", "Presidential conversations", "Public Papers"];\n  const kinds = ["All", ...new Set(conversations.map((record) => record.kind).sort())];', 'scope list')
          s = replace_once(s, '  const years = ["All", ...new Set(conversations.map(conversationYear).filter(Boolean).sort())];\n\n  renderButtonGroup(nodes.conversationKindFilters, kinds, state.conversationKind, (value) => {', '  const years = ["All", ...new Set(conversations.map(conversationYear).filter(Boolean).sort())];\n\n  renderButtonGroup(nodes.conversationScopeFilters, scopes, state.conversationScope, (value) => {\n    state.conversationScope = value;\n    renderConversationFilters(data);\n    renderConversations(data);\n  });\n\n  renderButtonGroup(nodes.conversationKindFilters, kinds, state.conversationKind, (value) => {', 'scope buttons')
          s = replace_once(s, '    empty.textContent = "No declassified records match the current filters.";', '    empty.textContent = "No records match the current filters.";', 'empty copy')
          s = replace_once(s, '  const types = ["All", ...new Set(data.sources.map((source) => source.type))];', '  const types = ["All", ...new Set(data.sources.map(sourceTypeLabel))];', 'source filter labels')
          s = replace_once(s, '    .filter((source) => state.filter === "All" || source.type === state.filter)', '    .filter((source) => state.filter === "All" || sourceTypeLabel(source) === state.filter)', 'source filter')
          s = replace_once(s, '    heading.textContent = source.title;', '    heading.textContent = sourceTitle(source);', 'source title')
          s = replace_once(s, '    priority.textContent = source.priority;', '    priority.textContent = source.priority || source.status || "Source";', 'source priority')
          s = replace_once(s, '    type.textContent = source.type;', '    type.textContent = sourceTypeLabel(source);', 'source type')
          s = replace_once(s, '  nodes.conversationReset.addEventListener("click", () => {\n    state.conversationKind = "All";', '  nodes.conversationReset.addEventListener("click", () => {\n    state.conversationScope = "Declassified";\n    state.conversationKind = "All";', 'reset scope')
          s = replace_once(s, '  } catch (error) {\n    nodes.sourcesRoot.innerHTML', '  } catch (error) {\n    console.error(error);\n    nodes.sourcesRoot.innerHTML', 'catch log')
          app.write_text(s)

          index = Path('index.html')
          s = index.read_text()
          s = s.replace('20260526-chronology', '20260601-scope2')
          s = replace_once(s, '          </label>\n          <div>\n            <p class="tool-label">Form</p>', '          </label>\n          <div>\n            <p class="tool-label">Scope</p>\n            <div id="conversation-scope-filters" class="filter-row compact" aria-label="Document scope filters"></div>\n          </div>\n          <div>\n            <p class="tool-label">Form</p>', 'scope control markup')
          index.write_text(s)

          css = Path('styles.css')
          s = css.read_text()
          s = replace_once(s, '  grid-template-columns: minmax(260px, 1fr) auto auto auto;', '  grid-template-columns: minmax(260px, 1fr) repeat(3, minmax(150px, max-content)) auto auto;', 'chronology tool grid')
          css.write_text(s)

          workflow = Path('.github/workflows/codex-apply-scope.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css .github/workflows/codex-apply-scope.yml
          git diff --cached --quiet && exit 0
          git commit -m "Default chronology to declassified records"
          git push
